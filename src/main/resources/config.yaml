services:
  - name: ss服务            #名称
    mode: ss               #ss模式
    localPort: 30005       #本地绑定端口
    passWord: 924c5e53af4a # 密码
    encrypt: aes-128-gcm   # 算法
    enable: true           #是否启用

  - name: 端口转发服务
    mode: forward
    serverHost: 127.0.0.1
    serverPort: 9089
    localPort: 9090
    enable: false

  - name: HTTP代理服务
    mode: http_proxy
    localPort: 9999
    userName: a
    passWord: a
    enable: false
global:
  client_time_out: 5000 # 全局客户端超时时间 5s
logger:
  level: DEBUG   # DEBUG,INFO,WARN,ERROR
  format: SIMPLE # SIMPLE,HEX_DUMP,TEXTUAL